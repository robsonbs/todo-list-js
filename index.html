<!doctype html>
<html lang="pt-BR">
  <!-- ============================================================
       PÁGINA PRINCIPAL — Lista de Tarefas (TODO List)
       ------------------------------------------------------------
       Este arquivo contém apenas a ESTRUTURA da página.
       A aparência fica em style.css e o comportamento em js/main.js.
       Separar estrutura, estilo e comportamento é uma boa prática:
       cada parte fica mais fácil de entender e manter.
       ============================================================ -->
  <head>
    <!-- Charset UTF-8: permite acentos e caracteres especiais (pt-BR). -->
    <meta charset="UTF-8" />

    <!-- Viewport: base do design responsivo em celulares e tablets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon local: evita o pedido automático a /favicon.ico. -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <!-- Fonte Inter servida localmente (assets/fonts).
         O preload antecipa o download do .woff2; "crossorigin" é
         obrigatório no preload de fontes, mesmo same-origin. -->
    <link
      rel="preload"
      href="assets/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>Lista de Tarefas - TODO List</title>

    <!-- Folha de estilos externa: toda a aparência da aplicação. -->
    <link rel="stylesheet" href="style.css" />

    <!-- modulepreload: baixa os módulos em paralelo, sem esperar a
         descoberta em cadeia a partir de main.js. -->
    <link rel="modulepreload" href="js/state.js" />
    <link rel="modulepreload" href="js/storage.js" />
    <link rel="modulepreload" href="js/validacao.js" />
    <link rel="modulepreload" href="js/dom.js" />
    <link rel="modulepreload" href="js/constants.js" />
    <link rel="modulepreload" href="js/icones.js" />
  </head>

  <body>
    <div class="container">
      <!-- ============================================================
           CABEÇALHO
           O emoji é decorativo (aria-hidden) e o texto é o conteúdo.
           ============================================================ -->
      <header id="header">
        <h1>
          <span class="logo-icon" aria-hidden="true">📝</span>
          TODO List
        </h1>
      </header>

      <!-- ============================================================
           FORMULÁRIO DE NOVA TAREFA
           ------------------------------------------------------------
           Usamos o evento "submit" do <form>: ele dispara tanto ao
           clicar no botão quanto ao pressionar Enter. Assim não é
           preciso duplicar a lógica de criação no JavaScript.
           ============================================================ -->
      <form id="todo-form" aria-label="Adicionar nova tarefa">
        <!-- Label acessível: o input continua compreensível para
             leitores de tela, mesmo com o placeholder. -->
        <label for="todo-input" class="sr-only">Nova tarefa</label>

        <!-- maxlength reflete a regra de negócio (100 caracteres)
             e evita digitação além do limite. O teste de contrato
             garante que ele acompanhe CONFIG.MAX_CARACTERES_TAREFA.
             Não usamos "required": a validação é feita em JavaScript
             para exibir a mensagem didática da aplicação. -->
        <input
          type="text"
          id="todo-input"
          name="nova-tarefa"
          placeholder="Adicione uma nova tarefa"
          maxlength="100"
          autocomplete="off"
        />

        <!-- type="submit" aciona o submit do formulário. -->
        <button type="submit" id="btn-criar" aria-label="Criar nova tarefa">
          <span aria-hidden="true">➕</span>
          Criar
        </button>
      </form>

      <!-- ============================================================
           ÁREA PRINCIPAL
           Contém os contadores e a lista de tarefas.
           ============================================================ -->
      <main class="tarefas-container">
        <!-- aria-live="polite" avisa leitores de tela sobre mudanças
             nos contadores sem interromper o usuário. -->
        <header class="tarefas-header" aria-live="polite">
          <div class="tarefas-criadas">
            <span>Tarefas criadas</span>
            <p id="contador-criadas" aria-label="Número de tarefas criadas">0</p>
          </div>

          <div class="tarefas-concluidas">
            <span>Concluídas</span>
            <p id="contador-concluidas" aria-label="Número de tarefas concluídas">0 de 0</p>
          </div>
        </header>

        <!-- Container da lista.
             role="list" combina com role="listitem" em cada tarefa
             criada pelo JavaScript, mantendo a semântica correta.
             Não usamos aria-live aqui: a lista é recriada a cada
             mudança e o leitor de tela reanunciaria tudo. O feedback
             de novidade já vem dos contadores e das mensagens flash. -->
        <section class="tarefas-box" role="list" aria-label="Lista de tarefas">
          <!-- As tarefas são inseridas dinamicamente por js/dom.js. -->
        </section>
      </main>
    </div>

    <!-- type="module" permite usar import/export entre arquivos.
         O script fica no fim para que o HTML já exista quando o
         JavaScript for executado. -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
