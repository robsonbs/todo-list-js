# Blueprint do Render para a edição online.
# Rever preços/região e configurar SMTP antes de sincronizar este Blueprint.
# Os dois serviços precisam ficar na mesma região para usar a rede privada.
services:
  - type: web
    name: todo-list-web
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    branch: main
    region: ohio
    plan: 0.5c-512mb
    healthCheckPath: /api/health
    autoDeployTrigger: 'off'
    preDeployCommand: npm run db:migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: todo-list-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: EMAIL_MODE
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TRUST_PROXY_HOPS
        value: '1'

databases:
  - name: todo-list-db
    databaseName: todo_web
    user: todo_app
    region: ohio
    postgresMajorVersion: '17'
    plan: 0.1c-256mb
    ipAllowList: []
