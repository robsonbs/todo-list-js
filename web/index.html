<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lista de tarefas online com contas individuais." />
    <title>Minha Lista Online</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="cabecalho">
      <p class="selo">MISSÃO: LISTA NA NUVEM</p>
      <h1>📝 Minha Lista Online</h1>
      <p>Em breve: suas tarefas, com você em qualquer lugar.</p>
    </header>
    <main class="conteudo">
      <section class="cartao" aria-labelledby="titulo-status">
        <h2 id="titulo-status">Conexão com o servidor</h2>
        <p id="estado-servidor" role="status" aria-live="polite">Verificando a API…</p>
      </section>
    </main>
    <footer class="rodape">
      <p>Construído passo a passo no curso de JavaScript.</p>
    </footer>
  </body>
</html>
