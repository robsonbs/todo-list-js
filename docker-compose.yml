services:
  servidor:
    image: python:3.15.2-slim-trixie@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
    volumes:
      - .:/app
    working_dir: /app
    command: python3 -m http.server 8080
    networks:
      - todo-network
    ports:
      - 8080:8080

  playwright:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    depends_on:
      - servidor
    environment:
      - BASE_URL=http://servidor:8080
      # CI=1 deixa o Playwright em modo não interativo:
      # reporter "list", workers limitados e retries.
      - CI=1
      - PLAYWRIGHT_WORKERS=${PLAYWRIGHT_WORKERS:-4}
    volumes:
      # Monta os testes do host: as screenshots geradas aparecem
      # em tests/e2e/screenshots sem precisar rebuildar a imagem.
      - ./tests/e2e:/app/tests/e2e
      # Permite ao GitHub Actions enviar traces e screenshots em falhas.
      - ./test-results:/app/test-results
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge
